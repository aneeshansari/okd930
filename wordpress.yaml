apiVersion: v1
kind: Pod
metadata:
  labels:
    app: wordpress
  name: wordpress
spec:
  containers:
  - name: con1
    image: wordpress:latest
    ports:
    - containerPort: 80
    env:
    - name: WORDPRESS_DB_HOST
      value: wordpress
    - name: WORDPRESS_DB_USER
      value: root
    - name: WORDPRESS_DB_PASSWORD
      value: test123
    - name: WORDPRESS_DB_NAME
      value: wordpress1
    - name: WORDPRESS_TABLE_PREFIX
      value: wp_
  - name: con2
    image: mysql:latest
    ports:
    - containerPort: 3306
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: test123
    - name: MYSQL_DATABASE
      value: wordpress1

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
spec: 
  type: ClusterIP
  selector:
    app: wordpress
  ports:
  - name: wordpress
    protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wordpress-route
spec:
  host: wordpress-default.apps-crc.testing
  port:
    targetPort: wordpress
  to:
    kind: Service
    name: wordpress-svc

